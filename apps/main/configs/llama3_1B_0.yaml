dump_dir: /raid/user_data/rsadhukh/logs/llama3_1B_0
name: "llama3_1B_0"
model_type: "llama"
steps: 60_000
probe_freq: 100
seed: 777

optim:
    lr: 1e-5
    weight_decay: 0.033
    warmup: 2000
    lr_min_ratio: 0.000001
    clip: 1.0

distributed:
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1
    stem_parallel_size: 2

model:
    dim: 2048
    ffn_dim_multiplier: 1.5
    n_layers: 16
    n_heads: 32
    n_kv_heads: 8
    head_dim: 64
    weight_tying: True
    init_base_std: 0.02
    init_std_factor: disabled
    max_seqlen: 8192
    rope_theta: 500000.0

data:
    root_dir: /raid/user_data/rsadhukh/dolma3_dolmino_mix-10B_shuffled
    sources:
        CommonCrawlHQ: 22.5
        Code_Main: 20.0
        Math_Main: 18.06
        InstQA_Main: 11.1
        Reasoning_Traces: 7.49
        STEM_Heavy: 10.0
        Flashcards_RCQA: 8.9
    batch_size: 2
    prefetch_size: 1024
    seq_len: 4096
    n_views: 2
    load_async: true
    add_bos: true
    add_eos: true
    tokenizer:
        name: tiktoken
        path: tokenizer/original/tokenizer.model

profiling:
    run: true

checkpoint:
    # path: logs/debug/checkpoints
    dump:
        every: 100
        keep: 1
    eval:
        every: 100
        keep: 1

logging:
    freq: 10
    wandb:
        project: "stem"
        name: "stem-test"

eval:
    generator:
        max_tokens: 4096
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - hellaswag
            - piqa
        limit: 100
    validation:
        max_steps: 100