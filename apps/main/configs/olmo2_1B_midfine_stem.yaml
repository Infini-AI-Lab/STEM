dump_dir: logs/debug
name: "olmo2_1B_midfine_stem"
model_type: olmo3
steps: 25_000
probe_freq: 100
seed: 777
grad_acc_steps: 4

optim:
    scheduler: "linear"
    lr: 7.44e-5
    weight_decay: 0.1
    warmup: 0
    lr_min_ratio: 0.5
    clip: 1.0

stem_lr: 1.5e-4
stem_weight_decay: 1e-4

distributed:
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

model:
    dim: 2048
    ffn_dim_multiplier: 1.5
    multiple_of: 256
    n_layers: 16
    n_heads: 16
    n_kv_heads: 16
    head_dim: 128
    weight_tying: false
    init_base_std: 0.02
    init_std_factor: disabled
    norm_eps: 1.0e-6
    max_seqlen: 4096
    vocab_size: 100352
    rope_theta: 500000.0
    rope_scaling: null

data:
    root_dir: /dev/shm/dolmino-mix_shuffled
    sources:
        # common_crawl-high_quality: 22.5
        # stem-heavy-crawl: 5.0
        # olmocr-science_pdfs: 5.0
        Code_Main: 20.0
        Math_Main: 18.06
        InstQA_Main: 5.0
        Reasoning_Traces: 7.49
        STEM_Heavy: 10.0
        Flashcards_RCQA: 8.9
    node_local: false
    batch_size: 4
    prefetch_size: 1024
    seq_len: 4096
    n_views: 2
    load_async: true
    add_bos: true
    add_eos: true
    tokenizer:
        name: huggingface
        path: checkpoints/olmo2-1b-stage1-token1T

profiling:
    run: true

checkpoint:
    # Student initialization checkpoint (typically prepared by prepare_stem_checkpoint.py)
    init_ckpt_path: checkpoints/olmo2-1b-stem-1T-init
    dump:
        every: 10000
        keep: 1
    eval:
        every: 5000
        keep: 1

logging:
    freq: 10
    wandb:
        project: "stem"
        name: "olmo2-1B-midfine-code"

eval:
    generator:
        max_tokens: 16384
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - task: hellaswag
              dataset_path: /scratch/local/xun/eval_data/hellaswag
            - task: boolq
              dataset_path: /scratch/local/xun/eval_data/super_glue
            - task: piqa
              dataset_path: /scratch/local/xun/eval_data/piqa
            - task: winogrande
              dataset_path: /scratch/local/xun/eval_data/winogrande
            - task: openbookqa
              dataset_path: /scratch/local/xun/eval_data/openbookqa
            - task: arc_easy
              dataset_path: /scratch/local/xun/eval_data/ai2_arc
            - task: arc_challenge
              dataset_path: /scratch/local/xun/eval_data/ai2_arc
            - task: race
              dataset_path: /scratch/local/xun/eval_data/race
            - task: mmlu
              dataset_path: /scratch/local/xun/eval_data/mmlu
            - task: gsm8k
              dataset_path: /scratch/local/xun/eval_data/gsm8k
            - task: mbpp
              dataset_path: /scratch/local/xun/eval_data/mbpp
            - task: humaneval
              dataset_path: /scratch/local/xun/eval_data/humaneval
        confirm_run_unsafe_code: true
        batch_size: 64
    validation:
        max_steps: 1000