# =============================================================================
# STEM Diagnostics Configuration
# =============================================================================
# Metrics:
#   1. Per-position loss decomposition (delta_ell)
#   2. Residual stream contribution norm analysis
#   3. CKA between attention and FFN outputs per layer
#   A. Cross-model hidden state divergence (STEM vs vanilla)
#   B. STEM embedding effective rank and spectral energy
#
# Usage:
#   python -m apps.main.stem_diagnostics config=apps/main/configs/stem_diagnostics.yaml
#
# Metrics A and B-w3-comparison require vanilla_ckpt_dir.
# Metric B runs without vanilla but adds w3 comparison when available.
# =============================================================================

dump_dir: /raid/user_data/rsadhukh/ejhong/logs/diagnostics
name: stem_diagnostics_llama3_1B
model_type: llama  # llama | qwen3 | olmo3

# --- Checkpoint paths ---
stem_ckpt_dir: /raid/user_data/rsadhukh/checkpoints/lm1b-midtrain-stem-100B/0000200000

# Vanilla (pre-STEM) checkpoint for Metrics 1, A, and B-w3-comparison.
# Required for Metric A (hidden divergence). Strongly recommended for all.
vanilla_ckpt_dir: /raid/user_data/rsadhukh/checkpoints/Llama-3.2-1B/distcp
# vanilla_ckpt_dir: /raid/user_data/rsadhukh/checkpoints/Llama-3.2-1B/original

# --- Data ---
data_root_dir: /raid/user_data/rsadhukh
data_sources:
  - dclm-baseline_shuffled
tokenizer_name: tiktoken
tokenizer_path: tokenizer/original/tokenizer.model

seq_len: 4096
max_batches: 50
batch_size: 4
seed: 42

# --- Which metrics to compute ---
compute_loss_decomposition: true   # Metric 1: where does STEM help/hurt?
compute_residual_norms: true       # Metric 2: is STEM's contribution used?
compute_cka: true                  # Metric 3: is STEM redundant with attention?
compute_hidden_divergence: true    # Metric A: how does error propagate?
compute_embedding_rank: true       # Metric B: has STEM collapsed dimensionally?

