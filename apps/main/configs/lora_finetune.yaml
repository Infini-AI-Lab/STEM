# =============================================================================
# LoRA (Low-Rank Adaptation) Finetuning Configuration
# =============================================================================
#
# Finetunes a pretrained Llama-3.2-1B by injecting low-rank adapters into
# attention layers, freezing all base model weights, and training only the
# LoRA parameters (~0.1-1% of total parameters).
#
# Usage:
#   torchrun --nproc-per-node 8 -m apps.main.lora_finetune \
#       config=apps/main/configs/lora_finetune.yaml
#
# Override any field via CLI:
#   torchrun --nproc-per-node 8 -m apps.main.lora_finetune \
#       config=apps/main/configs/lora_finetune.yaml \
#       lora_rank=16 lora_alpha=32 lora_lr=5e-4
# =============================================================================

dump_dir: logs/lora_finetune
name: "lora_finetune_llama3_1B"
seed: 42

# Total optimizer steps
steps: 10000

# Gradient accumulation
grad_acc_steps: 4
gc_collect_freq: 1000

# ---- LoRA configuration ----

# LoRA rank: higher = more expressive but more parameters.
# Typical values: 4, 8, 16, 32, 64
lora_rank: 8

# LoRA alpha: scaling factor. Effective scaling = alpha / rank.
# Common convention: alpha = 2 * rank (scaling = 2.0)
lora_alpha: 16

# Dropout on the LoRA input path (regularization)
lora_dropout: 0.05

# Which modules to attach LoRA adapters to.
# For attention-only LoRA (most common baseline):
#   - attention_q, attention_v  (QLoRA-style, ~0.1% params)
# For attention + FFN LoRA (more expressive):
#   - attention_q, attention_k, attention_v, attention_o, ffn_w1, ffn_w3
# Valid keys: attention_q, attention_k, attention_v, attention_o,
#             ffn_w1, ffn_w2, ffn_w3
lora_target_modules:
    - attention_q
    - attention_v

# Which layers to apply LoRA. null = all layers.
# For selective LoRA, specify a list of layer indices:
#   lora_layers: [0, 4, 8, 12, 15]
lora_layers: null

# ---- LoRA optimizer ----
# Higher LR than full finetuning since we're training far fewer params.
lora_lr: 3e-4
lora_weight_decay: 0.0
lora_beta1: 0.9
lora_beta2: 0.95
lora_epsilon: 1e-8
lora_clip: 1.0

# ---- LR schedule ----
scheduler: cosine
warmup_steps: 200
lr_min_ratio: 0.01

# ---- Model architecture (Llama-3.2-1B) ----
model:
    dim: 2048
    ffn_dim_multiplier: 1.5
    n_layers: 16
    n_heads: 32
    n_kv_heads: 8
    head_dim: 64
    weight_tying: true
    init_base_std: 0.02
    init_std_factor: disabled
    max_seqlen: 4096
    rope_theta: 500000.0

# ---- Distributed training ----
distributed:
    fsdp_type: full_shard
    compile: false          # Disabled for LoRA module compatibility
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

# ---- Data ----
data:
    root_dir: /dev/shm/
    sources:
        dolmino-mix_shuffled: 1.0
    batch_size: 4
    prefetch_size: 1024
    seq_len: 4096
    n_views: 2
    load_async: true
    add_bos: true
    add_eos: true
    tokenizer:
        name: tiktoken
        path: tokenizer/original/tokenizer.model

# ---- Checkpointing ----
# init_ckpt_path MUST point to the pretrained checkpoint in distcp format.
checkpoint:
    init_ckpt_path: checkpoints/Llama-3.2-1B/distcp
    dump:
        every: 2000
        keep: 3
    eval:
        every: 2000
        keep: 1

# ---- Logging ----
logging:
    freq: 10
    wandb:
        project: "stem"
        name: "lora-finetune"

# ---- Profiling ----
profiling:
    run: false

# ---- Evaluation (optional) ----
eval:
    generator:
        max_tokens: 4096
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - hellaswag
            - piqa
            - task: nq_open
              num_fewshot: 5
    validation:
        max_steps: 100