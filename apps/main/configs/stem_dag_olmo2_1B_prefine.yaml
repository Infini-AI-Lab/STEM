# DAG-STEM training for OLMo2 1B (backbone type olmo3_dag in this repo).
#
# Prerequisite: run prepare_dag_stem_checkpoint.py on your OLMo2-1B distcp checkpoint,
# with matching --stem-layers and --stem-parallel-size, e.g.:
#   python apps/main/prepare_dag_stem_checkpoint.py \
#     --ckpt-path /path/to/olmo2-1b/distcp \
#     --output-dir /path/to/olmo2-1b-dag-stem-init \
#     --model-type olmo3 \
#     --stem-layers 2 6 10 14 \
#     --stem-parallel-size 4 \
#     --alpha-init -5.0
#
# Launch:
#   torchrun --nproc-per-node=<N> -m apps.main.stem_dag_train \
#     config=apps/main/configs/stem_dag_olmo2_1B.yaml

dump_dir: logs/stem_dag_olmo2_1B
name: stem_dag_olmo2_1B
model_type: olmo3_dag
steps: 50_000
probe_freq: 100
seed: 777
grad_acc_steps: 4

optim:
    lr: 4e-4
    weight_decay: 0.1
    warmup: 0
    lr_min_ratio: 0.1
    clip: 1.0
    initial_token_offset: 480000
    global_final_step: 2384186

stem_lr: 8e-4
stem_weight_decay: 1e-4
stem_warmup: 1000

distributed:
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1
    stem_parallel_size: 4

model:
    dim: 2048
    ffn_dim_multiplier: 1.5000915583
    multiple_of: 256
    n_layers: 16
    n_heads: 16
    n_kv_heads: 16
    head_dim: 128
    weight_tying: false
    init_base_std: 0.02
    init_std_factor: disabled
    norm_eps: 1.0e-6
    max_seqlen: 4096
    vocab_size: 100352
    rope_theta: 500000.0
    rope_scaling: null
    stem_layers: [2, 6, 10, 14]
    alpha_init: -5.0

data:
    root_dir: /dev/shm
    sources:
        dclm-baseline_shuffled: 1.0
    node_local: true
    batch_size: 4
    prefetch_size: 1024
    seq_len: 4096
    n_views: 2
    load_async: true
    add_bos: true
    add_eos: true
    tokenizer:
        name: huggingface
        path: checkpoints/olmo2-1b-stage1-token1T

profiling:
    run: true

checkpoint:
    init_ckpt_path: checkpoints/olmo2-1b-dag-stem-init
    dump:
        every: 10000
        keep: 1
    eval:
        every: 10000
        keep: 1

logging:
    freq: 10
    wandb:
        project: stem
        name: stem-dag-olmo2-1B

eval:
    generator:
        max_tokens: 8192
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - hellaswag
            - piqa
        limit: 100
    validation:
        max_steps: 2000
