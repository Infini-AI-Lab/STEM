dump_dir: logs/qwen3_1.7B
name: qwen3_1.7B
model_type: qwen3
steps: 60_000
probe_freq: null
seed: 777

optim:
  lr: 2e-5
  weight_decay: 0.033
  warmup: 2000
  lr_min_ratio: 0.000001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: false
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  dim: 2048
  n_layers: 28
  n_heads: 16
  n_kv_heads: 8
  head_dim: 128
  ffn_dim_multiplier: 1.1250686687
  multiple_of: 256
  norm_eps: 1e-6
  rope_theta: 1000000.0
  max_seqlen: 8192
  vocab_size: 151936
  weight_tying: true
  init_base_std: 0.02
  init_std_factor: disabled

data:
  root_dir: data/shuffled
  sources:
      fineweb_edu_10bt: 1.0
  batch_size: 4
  prefetch_size: 1024
  seq_len: 4096
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: huggingface
    path: checkpoints/Qwen3-1.7B-Base

profiling:
    run: true

checkpoint:
    init_ckpt_path: checkpoints/Qwen3-1.7B-Base-lingua
    dump:
        every: 20
        keep: 1
    eval:
        every: 200
        keep: 1

logging:
    freq: 10

eval:
    generator:
        max_tokens: 4096
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - hellaswag
            - piqa
            - task: nq_open
              num_fewshot: 5
    validation:
        max_steps: 100

