# =============================================================================
# Full Backbone Finetuning Configuration
# =============================================================================
#
# Finetunes a pretrained Llama-3.2-1B by continuing to train all (or a subset
# of) model parameters with finetuning-appropriate hyperparameters.
#
# Usage:
#   torchrun --nproc-per-node 8 -m apps.main.backbone_finetune \
#       config=apps/main/configs/backbone_finetune.yaml
#
# Override any field via CLI:
#   torchrun --nproc-per-node 8 -m apps.main.backbone_finetune \
#       config=apps/main/configs/backbone_finetune.yaml \
#       optim.lr=1e-5 freeze_layers=8 steps=20000
# =============================================================================

dump_dir: logs/backbone_finetune
name: "backbone_finetune_llama3_1B"
seed: 42

# Total optimizer steps
steps: 10000

# Gradient accumulation
grad_acc_steps: 1
gc_collect_freq: 1000

# ---- Layer freezing ----
# Number of initial transformer layers to freeze (0 = train all layers).
# For a 16-layer model, freeze_layers=8 freezes layers 0-7, trains 8-15.
freeze_layers: 0

# Whether to freeze the token embedding layer
freeze_embeddings: false

# Whether to freeze the output projection (lm_head / tied embeddings)
freeze_output: false

# ---- Optimizer ----
# For full finetuning, use a smaller LR than pretraining (2e-5 vs 3e-4).
# Weight decay 0.033 is a common choice for continued training.
optim:
    lr: 2e-5
    weight_decay: 0.033
    warmup: 2000
    lr_min_ratio: 0.01
    clip: 1.0
    scheduler: cosine
    beta1: 0.9
    beta2: 0.95
    epsilon: 1e-8

# ---- Model architecture (Llama-3.2-1B) ----
model:
    dim: 2048
    ffn_dim_multiplier: 1.5
    n_layers: 16
    n_heads: 32
    n_kv_heads: 8
    head_dim: 64
    weight_tying: true
    init_base_std: 0.02
    init_std_factor: disabled
    max_seqlen: 4096
    rope_theta: 500000.0

# ---- Distributed training ----
distributed:
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

# ---- Data ----
data:
    root_dir: /dev/shm/
    sources:
        # dolmino-mix_shuffled: 1.0
        fineweb_edu_10bt_shuffled: 1.0
    batch_size: 4
    prefetch_size: 1024
    seq_len: 4096
    n_views: 2
    load_async: true
    add_bos: true
    add_eos: true
    tokenizer:
        name: tiktoken
        path: tokenizer/original/tokenizer.model

# ---- Checkpointing ----
# init_ckpt_path MUST point to the pretrained checkpoint in distcp format.
checkpoint:
    init_ckpt_path: checkpoints/Llama-3.2-1B/distcp
    dump:
        every: 2000
        keep: 3
    eval:
        every: 2000
        keep: 1

# ---- Logging ----
logging:
    freq: 10
    wandb:
        project: "stem"
        name: "backbone-finetune"

# ---- Profiling ----
profiling:
    run: false

# ---- Evaluation (optional) ----
eval:
    generator:
        max_tokens: 4096
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - hellaswag
            - piqa
            - task: nq_open
              num_fewshot: 5
    validation:
        max_steps: 100