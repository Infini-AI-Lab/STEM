# Projection-based learning of STEM embeddings.
#
# Learns a linear projection (dim -> hidden_dim) that maps token embeddings
# to the STEM up-projection space, using the same LMTransformer architecture
# but with w3 receiving token embeddings instead of hidden states.
#
# Two loss modes:
#   mse -- Layerwise distillation via MSE on FFN down-projection outputs
#   nll -- End-to-end NLL with projections replacing w3 at stem layers
#
# Usage:
#   torchrun --nproc_per_node=8 -m apps.main.stem_projection_finetune \
#       config=apps/main/configs/stem_llama3_1B_projection.yaml

dump_dir: logs/stem_projection_finetune
name: "stem_projection_finetune_1B"
steps: 10_000
seed: 42

# Which layers get a projection (replaces w3 input with token embeddings)
stem_layers: [2, 6, 10, 14]

# Loss type: "mse" (layerwise distillation) or "nll" (end-to-end)
loss_type: mse

# Initialize projections from pretrained w3 weights (recommended)
init_from_w3: true

# Optimizer / schedule for the projections
proj_lr: 2e-3
proj_weight_decay: 0.05
proj_beta1: 0.9
proj_beta2: 0.95
proj_epsilon: 1e-8
proj_clip: 1.0
proj_scheduler: cosine
proj_warmup: 500
proj_lr_min_ratio: 0.01

grad_acc_steps: 1

distributed:
    fsdp_type: full_shard
    compile: false          # hooks require compilation to be off
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1
    stem_parallel_size: 4   # used for saving derived STEM embedding shards

model:
    dim: 2048
    ffn_dim_multiplier: 1.5
    n_layers: 16
    n_heads: 32
    n_kv_heads: 8
    head_dim: 64
    weight_tying: true
    init_base_std: 0.02
    init_std_factor: disabled
    max_seqlen: 8192
    rope_theta: 500000.0

data:
    root_dir: /raid/user_data/rsadhukh
    sources:
        dclm-baseline_shuffled: 1.0
    batch_size: 16
    prefetch_size: 1024
    seq_len: 4096
    n_views: 2
    load_async: true
    add_bos: true
    add_eos: true
    tokenizer:
        name: tiktoken
        path: tokenizer/original/tokenizer.model

profiling:
    run: false

checkpoint:
    init_ckpt_path: checkpoints/Llama-3.2-1B/distcp   # pretrained LLaMA checkpoint
    dump:
        every: 2500
        keep: 1
    eval:
        every: 20000
        keep: 1

logging:
    freq: 10
    wandb:
        project: "stem"
        name: "stem-projection-finetune-mse"

