dump_dir: logs/debug
name: large_lm
steps: 60_000
probe_freq: null
seed: 777

optim:
  lr: 2e-5
  weight_decay: 0.033
  warmup: 2000
  lr_min_ratio: 0.000001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: false
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  dim: 2048
  ffn_dim_multiplier: 1.5
  n_layers: 16
  n_heads: 32
  n_kv_heads: 8
  head_dim: 64
  weight_tying: True
  init_base_std: 0.02
  init_std_factor: disabled
  max_seqlen: 8192
  rope_theta: 500000.0

data:
  root_dir: /raid/user_data/rsadhukh
  sources:
      dclm-baseline_shuffled: 1.0
  batch_size: 4
  prefetch_size: 1024
  seq_len: 4096
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: tiktoken
    path: tokenizer/original/tokenizer.model

profiling:
    run: true

checkpoint:
    init_ckpt_path: checkpoints/Llama-3.2-1B/distcp
    dump:
        every: 2000
        keep: 1
    eval:
        every: 2000
        keep: 1

logging:
    freq: 10

eval:
    generator:
        max_tokens: 4096
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - hellaswag
            - piqa
            - task: nq_open
              num_fewshot: 5
    validation:
        max_steps: 100