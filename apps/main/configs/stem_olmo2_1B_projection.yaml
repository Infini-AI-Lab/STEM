# Projection warmup for STEM embeddings.
#
# Learns a linear projection (dim -> hidden_dim) that maps token embeddings
# to the STEM up-projection space, using the same LMTransformer architecture
# but with w3 receiving token embeddings instead of hidden states.
#
# Usage:
#   torchrun --nproc_per_node=2 -m apps.main.stem_projection_warmup \
#       config=apps/main/configs/stem_olmo2_1B_projection.yaml

dump_dir: logs/stem_projection_warmup_olmo2_1B
name: "stem_projection_warmup_olmo2_1B"
model_type: olmo3
steps: 10_000
seed: 42

stem_layers: [1, 2, 3, 4]

collect_token_means: true
token_stat_reduce_chunk_size: 4096

# Periodic projection-replaced eval on a small heldout stream from data loader.
eval_max_steps: 50
eval_seed_offset: 1

# Projection warmup uses TrainArgs.optim.*
optim:
    lr: 2e-3
    weight_decay: 0.05
    beta1: 0.9
    beta2: 0.95
    epsilon: 1e-8
    scheduler: cosine
    warmup: 500
    lr_min_ratio: 0.01

proj_clip: 1.0

grad_acc_steps: 1

distributed:
    fsdp_type: full_shard
    compile: false
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1
    stem_parallel_size: 8

model:
    dim: 2048
    ffn_dim_multiplier: 1.5000915583
    multiple_of: 256
    n_layers: 16
    n_heads: 16
    n_kv_heads: 16
    head_dim: 128
    weight_tying: false
    init_base_std: 0.02
    init_std_factor: disabled
    norm_eps: 1.0e-6
    max_seqlen: 4096
    vocab_size: 100352
    rope_theta: 500000.0
    rope_scaling: null

data:
    root_dir: /dev/shm
    sources:
        dclm-baseline_shuffled: 1.0
    batch_size: 8
    prefetch_size: 1024
    seq_len: 4096
    n_views: 2
    load_async: true
    add_bos: true
    add_eos: true
    tokenizer:
        name: huggingface
        path: /checkpoints-fsx/beidchen-sandbox/stem/olmo2-1b-stage1-token1T

profiling:
    run: false

checkpoint:
    init_ckpt_path: /checkpoints-fsx/beidchen-sandbox/stem/olmo2-1b-stage1-token1T   # pretrained OLMo2 checkpoint
    dump:
        every: 4000
        keep: 1
    eval:
        every: 2000
        keep: 1

logging:
    freq: 10
    wandb:
        project: "stem"
        name: "stem-projection-olmo2-1B"

