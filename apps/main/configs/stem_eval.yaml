name: "stem_eval"
dump_dir: logs/stem_eval
ckpt_dir: logs/extended_pretraining/checkpoints/0000006600
stem_parallel_size: 8  # must match training stem_parallel_size

generator:
    max_tokens: 4096
    dtype: bf16
    temperature: 0.0
    top_p: 0.95

harness:
    tasks:
        - hellaswag
        - task: nq_open
          num_fewshot: 5
        - piqa
        # - task: social_iqa
        #   dataset_kwargs:
        #     trust_remote_code: true
        # - triviaqa
        # - winogrande
        - openbookqa
        - arc_easy
        - arc_challenge
    batch_size: 8
    num_fewshot: 0
    limit: 100

validation: 
    max_steps: 100

