name: "stem_eval"
dump_dir: logs/stem_eval
ckpt_dir: checkpoints/STEM-1B-pretrain1T-midtrain100B-stem/
stem_parallel_size: 8  # must match training stem_parallel_size

generator:
    max_tokens: 4096
    dtype: bf16
    temperature: 0.0
    top_p: 0.95
    show_progress: true

harness:
  tasks:
    - hellaswag
    - task: boolq
      dataset_kwargs:
        trust_remote_code: true
    # - task: nq_open
    #   num_fewshot: 5
    - piqa
    # - task: social_iqa
    #   dataset_kwargs:
    #     trust_remote_code: true
    # - triviaqa
    - winogrande
    - openbookqa
    - arc_easy
    - arc_challenge
    - race
    # - commonsense_qa
    # - coqa
    # - copa
    # - gsm8k
    # - bbh
    # - mmlu
    # - mmlu_pro
  batch_size: 16
validation:
  max_steps: 1000

