dump_dir: logs/debug
name: "olmo2_1B_stem-dag_midfine"
model_type: olmo3_dag
steps: 50_000
probe_freq: 100
seed: 777
grad_acc_steps: 4

optim:
    scheduler: "linear"
    lr: 7.44e-5
    weight_decay: 0.1
    warmup: 0
    lr_min_ratio: 0.0
    clip: 1.0

stem_lr: 3e-4
stem_weight_decay: 1e-4
stem_lr_min_ratio: 0
stem_warmup: 1000

distributed:
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

model:
    dim: 2048
    ffn_dim_multiplier: 1.5
    multiple_of: 256
    n_layers: 16
    n_heads: 16
    n_kv_heads: 16
    head_dim: 128
    weight_tying: false
    init_base_std: 0.02
    init_std_factor: disabled
    norm_eps: 1.0e-6
    max_seqlen: 4096
    vocab_size: 100352
    rope_theta: 500000.0
    rope_scaling: null
    stem_layers: [1,2,3,4]
    alpha_init: -5.0

data:
    root_dir: /dev/shm/dolmino-mix_shuffled
    sources:
        # Code
        cranecode: 10.0
        stack_edu: 10.0

        # Math
        cranemath: 5.63
        dolmino-math: 10.7
        megamatt: 1.73
        tinymath-mind: 0.9
        tinymath-pot: 0.24

        # QA
        reddit_to_flashcards: 5.9
        wiki_to_rcqa: 3.0
        nemotron-synth-qa: 5.0

        # Thinking / Reasoning
        math-meta-reasoning: 0.38
        code-meta-reasoning: 0.46
        program_verifiable: 0.16
        qwq-reasoning-traces: 1.87
        openthoughts2: 1.25
        general_reasoning_mix: 1.87
        gemini-reasoning-traces: 0.25

        # Instruction
        tulu-3-sft: 1.1
        dolmino_1-flan: 5.0

        # STEM-heavy + PDFs + Web
        olmocr_science_pdfs: 5.0
        stem-heavy-crawl: 5.0
        common_crawl-high-quality: 22.5
    node_local: false
    batch_size: 8
    prefetch_size: 1024
    seq_len: 4096
    n_views: 2
    load_async: true
    add_bos: true
    add_eos: true
    track_packed_source_mixture: true
    tokenizer:
        name: huggingface
        path: checkpoints/olmo2-1b-stage1-token1T

profiling:
    run: true

checkpoint:
    # Student initialization checkpoint (typically prepared by prepare_stem_checkpoint.py)
    init_ckpt_path: checkpoints/olmo2-1b-stem-1T-init
    dump:
        every: 10000
        keep: 1
    eval:
        every: 5000
        keep: 1

logging:
    freq: 10
    wandb:
        project: "stem"
        name: "olmo2-1B-midfine-stem-dag"

eval:
    generator:
        max_tokens: 16384
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - task: hellaswag
              dataset_path: /data/rsadhukh/eval_data/hellaswag
            - task: boolq
              dataset_path: /data/rsadhukh/eval_data/super_glue
            - task: piqa
              dataset_path: /data/rsadhukh/eval_data/piqa
            - task: winogrande
              dataset_path: /data/rsadhukh/eval_data/winogrande
            - task: openbookqa
              dataset_path: /data/rsadhukh/eval_data/openbookqa
            - task: arc_easy
              dataset_path: /data/rsadhukh/eval_data/ai2_arc
            - task: arc_challenge
              dataset_path: /data/rsadhukh/eval_data/ai2_arc
            - task: race
              dataset_path: /data/rsadhukh/eval_data/race
            - task: mmlu
              dataset_path: /data/rsadhukh/eval_data/mmlu
            - task: gsm8k
              dataset_path: /data/rsadhukh/eval_data/gsm8k
            - task: mbpp
              dataset_path: /data/rsadhukh/eval_data/mbpp
            - task: humaneval
              dataset_path: /data/rsadhukh/eval_data/humaneval
        confirm_run_unsafe_code: true
        batch_size: 64
    validation: null