dump_dir: logs/debug
name: "stem_llama3_1B"
steps: 200_000
probe_freq: 100
seed: 777

optim:
    lr: 2e-5
    weight_decay: 0.033
    warmup: 2000
    lr_min_ratio: 0.01
    clip: 1.0

distributed:                                                                                                        
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1
    stem_parallel_size: 8

model:
    dim: 2048
    ffn_dim_multiplier: 1.5
    n_layers: 16
    n_heads: 32
    n_kv_heads: 8
    head_dim: 64
    weight_tying: True
    init_base_std: 0.02
    init_std_factor: disabled
    max_seqlen: 8192
    rope_theta: 500000.0
    stem_layers: [1, 3, 5, 7, 9, 11, 13, 15]

data:
    root_dir: /dev/shm/
    sources:
        dolmino-mix_shuffled: 1.0
    batch_size: 4
    prefetch_size: 1024
    seq_len: 4096
    n_views: 2
    load_async: true
    add_bos: true
    add_eos: true
    tokenizer:
        name: tiktoken
        path: tokenizer/original/tokenizer.model

profiling:
    run: true

checkpoint:
    # path: logs/debug/checkpoints
    init_ckpt_path: checkpoints/Llama-3.2-1B/distcp
    dump:
        every: 2000
        keep: 1
    eval:
        every: 2000
        keep: 1

logging:
    freq: 10
    wandb:
        project: "stem"
        name: "stem-test"

eval:
    generator:
        max_tokens: 4096
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness: 
        tasks:
            - hellaswag
            - piqa
        limit: 1000
    validation:
        max_steps: 100

