dump_dir: logs/debug
name: "stem_iir_llama3_1B_prefine"
model_type: "llama_iir"
steps: 200_000
probe_freq: 100
seed: 777
grad_acc_steps: 2

optim:
    lr: 1e-4
    weight_decay: 0.1
    warmup: 2000
    lr_min_ratio: 0.01
    clip: 1.0

stem_lr: 5e-4
stem_weight_decay: 0.0


distributed:                                                                                                        
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1
    stem_parallel_size: 8

model:
    dim: 2048
    ffn_dim_multiplier: 1.5
    n_layers: 16
    n_heads: 32
    n_kv_heads: 8
    head_dim: 64
    weight_tying: True
    init_base_std: 0.02
    init_std_factor: disabled
    max_seqlen: 131072
    rope_theta: 500000.0
    rope_scaling:
        factor: 8.0
        low_freq_factor: 1.0
        high_freq_factor: 4.0
        original_max_position_embeddings: 8192
    stem_layers: [1, 3, 5, 7, 9, 11, 13, 15]

    # IIR / EMA memory hyper-parameters
    iir_mu_init: 0.9
    iir_alpha_init: 0.3
    iir_learnable_m0: false
    iir_per_dim_alpha: false

data:
    root_dir: /dev/shm
    sources:
        dclm-baseline_shuffled: 1.0
    batch_size: 2
    prefetch_size: 1024
    seq_len: 4096
    n_views: 2
    load_async: true
    add_bos: true
    add_eos: true
    tokenizer:
        name: tiktoken
        path: tokenizer/original/tokenizer.model

profiling:
    run: true

checkpoint:
    # path: logs/debug/checkpoints
    init_ckpt_path: checkpoints/Llama-3.2-1B/distcp
    dump:
        every: 10000
        keep: 1
    eval:
        every: 10000
        keep: 1

logging:
    freq: 10
    wandb:
        project: "stem"
        name: "stem-test"

eval:
    generator:
        max_tokens: 4096
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness: 
        tasks:
            - task: hellaswag
              dataset_path: /checkpoints-fsx/beidchen-sandbox/stem/eval_data/hellaswag
            - task: boolq
              dataset_path: /checkpoints-fsx/beidchen-sandbox/stem/eval_data/super_glue
            - task: piqa
              dataset_path: /checkpoints-fsx/beidchen-sandbox/stem/eval_data/piqa
            - task: winogrande
              dataset_path: /checkpoints-fsx/beidchen-sandbox/stem/eval_data/winogrande
            - task: openbookqa
              dataset_path: /checkpoints-fsx/beidchen-sandbox/stem/eval_data/openbookqa
            - task: arc_easy
              dataset_path: /checkpoints-fsx/beidchen-sandbox/stem/eval_data/ai2_arc
            - task: arc_challenge
              dataset_path: /checkpoints-fsx/beidchen-sandbox/stem/eval_data/ai2_arc
            - task: race
              dataset_path: /checkpoints-fsx/beidchen-sandbox/stem/eval_data/race
    validation:
        max_steps: 1000