dump_dir: /raid/user_data/rsadhukh/logs/mobilellm_350M
name: mobilellm_350M_midtrain
model_type: "llama"
steps: 200_000
probe_freq: null
seed: 777
grad_acc_steps: 4 

optim:
  lr: 2e-4
  weight_decay: 0.1
  warmup: 2000
  lr_min_ratio: 0.01
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  dim: 960
  ffn_dim_multiplier: null
  n_layers: 32
  n_heads: 15
  n_kv_heads: 5
  head_dim: 64
  weight_tying: True
  vocab_size: 32000
  init_base_std: 0.02
  init_std_factor: disabled
  max_seqlen: 4096
  rope_theta: 10000.0
  rope_scaling: null

data:
  root_dir: /raid/user_data/rsadhukh/dolma3_dolmino_mix-10B_shuffled
  sources:
    CommonCrawlHQ: 22.5
    Code_Main: 20.0
    Math_Main: 18.06
    InstQA_Main: 11.1
    Reasoning_Traces: 7.49
    STEM_Heavy: 10.0
    Flashcards_RCQA: 8.9
  batch_size: 32
  prefetch_size: 1024
  seq_len: 4096
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: sp
    path: /raid/user_data/rsadhukh/checkpoints/MobileLLM-350M/tokenizer.model

profiling:
    run: true

checkpoint:
    init_ckpt_path: /raid/user_data/rsadhukh/checkpoints/MobileLLM-350M-lingua
    dump:
        every: 5000
        keep: 1
    eval:
        every: 5000
        keep: 1

logging:
    freq: 10
    wandb:
        project: "stem"
        name: "mobilellm_350M"

eval:
    generator:
        max_tokens: 4096
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - task: hellaswag
              dataset_path: /raid/user_data/rsadhukh/test_data/hellaswag
            - task: boolq
              dataset_path: /raid/user_data/rsadhukh/test_data/super_glue
            - task: piqa
              dataset_path: /raid/user_data/rsadhukh/test_data/piqa
            - task: arc_easy
              dataset_path: /raid/user_data/rsadhukh/test_data/ai2_arc
            - task: arc_challenge
              dataset_path: /raid/user_data/rsadhukh/test_data/ai2_arc
            - task: openbookqa
              dataset_path: /raid/user_data/rsadhukh/test_data/openbookqa
            - task: winogrande
              dataset_path: /raid/user_data/rsadhukh/test_data/winogrande
            - task: race
              dataset_path: /raid/user_data/rsadhukh/test_data/race
            - task: mmlu
              dataset_path: /raid/user_data/rsadhukh/test_data/mmlu
            - task: gsm8k
              dataset_path: /raid/user_data/rsadhukh/test_data/gsm8k
        limit: 1000
    validation:
        max_steps: 100
