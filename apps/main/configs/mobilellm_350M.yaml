dump_dir: logs/debug
name: large_lm
steps: 200_000
probe_freq: null
seed: 777

optim:
  lr: 2e-3
  weight_decay: 0.033
  warmup: 2000
  lr_min_ratio: 0.1
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  dim: 960
  ffn_dim_multiplier: 0.675
  n_layers: 32
  n_heads: 15
  n_kv_heads: 5
  head_dim: 64
  weight_tying: False
  vocab_size: 32000
  init_base_std: 0.02
  init_std_factor: disabled
  max_seqlen: 4096
  rope_theta: 10000.0
  rope_scaling: null

data:
  root_dir: /raid/user_data/rsadhukh
  sources:
    dclm-baseline_shuffled: 1.0
  batch_size: 32
  prefetch_size: 1024
  seq_len: 4096
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: sp
    path: /raid/user_data/rsadhukh/checkpoints/MobileLLM-350M/tokenizer.model

profiling:
    run: true

checkpoint:
    dump:
        every: 2000
        keep: 1
    eval:
        every: 2000
        keep: 1

logging:
    freq: 10

eval:
    generator:
        max_tokens: 4096
        dtype: bf16
        temperature: 1.0
        top_p: 0.95
    harness:
        tasks:
            - hellaswag
            - piqa
            - task: nq_open
              num_fewshot: 5
    validation:
        max_steps: 100
